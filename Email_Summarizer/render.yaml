services:
  - type: web
    name: email-summaries-dashboard
    runtime: python
    rootDir: Email_Summarizer
    buildCommand: pip install -r requirements.txt
    startCommand: ./start.sh
    plan: starter
    envVars:
      - key: EMAIL_SUMMARIZER_STORAGE_DIR
        value: /var/data/storage
      - key: EMAIL_SUMMARIZER_OUTPUT_DIR
        value: /var/data/output
      - key: EMAIL_SUMMARIZER_COOKIE_SECURE
        value: "true"
      - key: EMAIL_SUMMARIZER_PUBLIC_BASE_URL
        sync: false
      - key: EMAIL_SUMMARIZER_ENCRYPTION_KEY
        sync: false
      - key: EMAIL_SUMMARIZER_ADMIN_KEY
        sync: false
      - key: EMAIL_SUMMARIZER_RATE_LIMIT_ENABLED
        value: "true"
      - key: EMAIL_SUMMARIZER_MONITORING_ENABLED
        value: "true"
      - key: EMAIL_SUMMARIZER_LIMIT_RUN_SUMMARIZER_PER_DAY
        value: "10"
      - key: EMAIL_SUMMARIZER_LIMIT_SCHEDULED_REPORTS_PER_DAY
        value: "24"
      - key: EMAIL_SUMMARIZER_LIMIT_CHAT_PER_DAY
        value: "100"
      - key: EMAIL_SUMMARIZER_LIMIT_REFINE_PER_DAY
        value: "30"
      - key: EMAIL_SUMMARIZER_LIMIT_REPORT_DELIVERY_PER_DAY
        value: "50"
      - key: EMAIL_SUMMARIZER_SUBSCRIPTION_TRIAL_DAYS
        value: "7"
      - key: EMAIL_SUMMARIZER_SUBSCRIPTION_PRICE_CENTS
        value: "499"
      - key: EMAIL_SUMMARIZER_SUBSCRIPTION_PRICE_LABEL
        value: "$4.99"
      - key: EMAIL_SUMMARIZER_BILLING_EXEMPT_EMAILS
        value: bnzhang2001@gmail.com,bnnzhang2001@outlook.com,peter@yj-semitech.com
      - key: EMAIL_SUMMARIZER_STRIPE_CHECKOUT_URL
        sync: false
      - key: EMAIL_SUMMARIZER_STRIPE_CUSTOMER_PORTAL_URL
        sync: false
      - key: EMAIL_SUMMARIZER_CORS_ORIGINS
        sync: false
      - key: EMAIL_SUMMARIZER_COOKIE_DOMAIN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.1
      - key: IMAP_SERVER
        value: imap.gmail.com
      - key: IMAP_PORT
        value: "993"
      - key: IMAP_FOLDER
        value: INBOX
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: EMAIL_SUMMARIZER_REPORT_SMTP_HOST
        value: smtp.gmail.com
      - key: EMAIL_SUMMARIZER_REPORT_SMTP_PORT
        value: "465"
      - key: EMAIL_SUMMARIZER_REPORT_SMTP_USER
        value: discereresearch@gmail.com
      - key: EMAIL_SUMMARIZER_REPORT_SMTP_PASSWORD
        sync: false
      - key: EMAIL_SUMMARIZER_REPORT_FROM_EMAIL
        value: discereresearch@gmail.com
      - key: EMAIL_SUMMARIZER_REPORT_FROM_NAME
        value: Discere
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_TENANT_ID
        value: common
      - key: MICROSOFT_REDIRECT_URI
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
    disk:
      name: email-summaries-data
      mountPath: /var/data
      sizeGB: 10
