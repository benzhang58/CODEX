<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log In</title>
    <link rel="icon" type="image/png" href="/dashboard_static/discere-logo.png" />
    <link rel="apple-touch-icon" href="/dashboard_static/discere-logo.png" />
    <style>
      :root {
        --bg: #f5f5f7;
        --panel: rgba(255, 255, 255, 0.92);
        --border: #d9d9de;
        --text: #111111;
        --muted: #6e6e73;
        --accent: #111111;
        --shadow: 0 14px 40px rgba(17, 17, 17, 0.06);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(0, 0, 0, 0.035), transparent 32%),
          linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
      }

      .card {
        width: min(100%, 620px);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 28px;
        padding: 32px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(14px);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 42px;
        font-weight: 650;
        letter-spacing: -0.05em;
      }

      p {
        margin: 0 0 22px;
        color: var(--muted);
        line-height: 1.55;
      }

      .field {
        display: grid;
        gap: 6px;
        margin-bottom: 16px;
      }

      label {
        font-size: 14px;
        color: var(--muted);
      }

      input,
      button,
      a {
        font: inherit;
      }

      input {
        width: 100%;
        padding: 13px 14px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.96);
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 12px;
        margin-top: 20px;
      }

      .create-account-row {
        margin-top: 14px;
        text-align: center;
      }

      .create-account-link {
        display: inline-block;
        font-size: 13px;
        color: var(--muted);
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      button,
      .secondary-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 12px 16px;
        border-radius: 14px;
        text-decoration: none;
        font-weight: 600;
      }

      button {
        border: 1px solid #111111;
        background: #111111;
        color: #ffffff;
        cursor: pointer;
      }

      .secondary-button {
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.96);
        color: var(--text);
      }

      .status {
        margin-top: 18px;
        color: var(--muted);
        min-height: 22px;
      }

      @media (max-width: 720px) {
        .actions {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Email Dashboard</h1>
      <p>Log in with Gmail or Outlook. If you have a different email address, create an account.</p>

      <div class="field">
        <label for="emailInput">Email</label>
        <input id="emailInput" type="email" placeholder="you@example.com" />
      </div>

      <div class="field">
        <label for="passwordInput">Password</label>
        <input id="passwordInput" type="password" placeholder="Password" />
      </div>

      <div class="actions">
        <button id="loginButton" type="button">Log In</button>
        <a id="googleOauthButton" class="secondary-button" href="/auth/google/start">Continue with Google</a>
        <a id="microsoftOauthButton" class="secondary-button" href="/auth/microsoft/start">Continue with Microsoft</a>
      </div>

      <div class="create-account-row">
        <a class="create-account-link" href="/signup">Create account</a>
      </div>

      <div id="status" class="status"></div>
    </main>

    <script>
      const emailInput = document.getElementById("emailInput");
      const passwordInput = document.getElementById("passwordInput");
      const loginButton = document.getElementById("loginButton");
      const googleOauthButton = document.getElementById("googleOauthButton");
      const microsoftOauthButton = document.getElementById("microsoftOauthButton");
      const status = document.getElementById("status");

      function getRememberedOauth() {
        return {
          provider: String(localStorage.getItem("oauth:lastProvider") || "").trim(),
          email: String(sessionStorage.getItem("oauth:lastEmail") || "").trim().toLowerCase(),
        };
      }

      function setOauthAttempt(provider, mode, email = "") {
        sessionStorage.setItem("oauth:attemptProvider", provider);
        sessionStorage.setItem("oauth:attemptMode", mode);
        if (email) {
          sessionStorage.setItem("oauth:attemptEmail", email);
        } else {
          sessionStorage.removeItem("oauth:attemptEmail");
        }
      }

      function clearOauthAttempt() {
        sessionStorage.removeItem("oauth:attemptProvider");
        sessionStorage.removeItem("oauth:attemptMode");
        sessionStorage.removeItem("oauth:attemptEmail");
      }

      function friendlyOauthError(provider, errorCode) {
        const label = provider === "google" ? "Google" : "Microsoft";
        const code = String(errorCode || "").trim();
        const lower = code.toLowerCase();
        if (lower === "not_configured") {
          return `${label} sign-in is not configured yet. Add the ${label} OAuth client ID and secret first.`;
        }
        if (lower === "invalid_callback") {
          return `${label} sign-in failed because the callback did not match this browser session. Try again from this login page. If it keeps happening, confirm the production callback URL is configured in ${label}.`;
        }
        if (lower === "token_exchange_failed") {
          return `${label} sign-in failed while exchanging the login code. Confirm the OAuth secret and redirect URL are correct, then try again.`;
        }
        if (lower.includes("access_denied") || lower.includes("consent") || lower.includes("permission")) {
          return `${label} sign-in needs the requested permissions to continue. Try again and approve the permissions shown on the ${label} consent screen.`;
        }
        if (lower.includes("scope")) {
          return `${label} sign-in is missing a required permission scope. Reconnect with ${label} and approve mailbox/profile permissions.`;
        }
        return `${label} sign-in failed: ${code.replaceAll("_", " ")}`;
      }

      function startOauth(provider, mode = "interactive") {
        const remembered = getRememberedOauth();
        const rememberedEmail = remembered.provider === provider ? remembered.email : "";
        const params = new URLSearchParams();
        if (rememberedEmail) {
          params.set("login_hint", rememberedEmail);
        }
        if (mode === "silent") {
          params.set("prompt", "none");
        }
        const query = params.toString();
        setOauthAttempt(provider, mode, rememberedEmail);
        window.location.href = `/auth/${provider}/start${query ? `?${query}` : ""}`;
      }

      function beginOauth(provider) {
        const remembered = getRememberedOauth();
        if (remembered.provider === provider && remembered.email) {
          status.textContent = `Checking ${provider === "google" ? "Google" : "Microsoft"} session...`;
          startOauth(provider, "silent");
          return;
        }
        startOauth(provider, "interactive");
      }

      function looksLikeEmail(value) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(value || "").trim());
      }

      async function login() {
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        if (!email || !password) {
          status.textContent = "Enter your email and password first.";
          return;
        }
        if (!looksLikeEmail(email)) {
          status.textContent = "Incorrect email.";
          return;
        }

        loginButton.disabled = true;
        status.textContent = `Logging in as ${email}...`;
        try {
          const response = await fetch("/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });
          const data = await response.json();
          if (!response.ok) {
            status.textContent = data.detail || "Login failed.";
            return;
          }
          window.location.href = "/dashboard";
        } catch (error) {
          status.textContent = `Login failed: ${error.message}`;
        } finally {
          loginButton.disabled = false;
        }
      }

      async function loadSession() {
        const params = new URLSearchParams(window.location.search);
        const googleError = params.get("google_error");
        const microsoftError = params.get("microsoft_error");
        const response = await fetch("/auth/me");
        const data = await response.json();
        if (data.authenticated) {
          clearOauthAttempt();
          window.location.href = "/dashboard";
          return;
        }

        const attemptedProvider = String(sessionStorage.getItem("oauth:attemptProvider") || "").trim();
        const attemptedMode = String(sessionStorage.getItem("oauth:attemptMode") || "").trim();
        const attemptedEmail = String(sessionStorage.getItem("oauth:attemptEmail") || "").trim().toLowerCase();

        if (googleError && attemptedProvider === "google" && attemptedMode === "silent") {
          clearOauthAttempt();
          status.textContent = "Continuing with Google...";
          setOauthAttempt("google", "interactive", attemptedEmail);
          const params = new URLSearchParams();
          if (attemptedEmail) {
            params.set("login_hint", attemptedEmail);
          }
          window.location.href = `/auth/google/start${params.toString() ? `?${params.toString()}` : ""}`;
          return;
        }

        if (microsoftError && attemptedProvider === "microsoft" && attemptedMode === "silent") {
          clearOauthAttempt();
          status.textContent = "Continuing with Microsoft...";
          const params = new URLSearchParams();
          if (attemptedEmail) {
            params.set("login_hint", attemptedEmail);
          }
          setOauthAttempt("microsoft", "interactive", attemptedEmail);
          window.location.href = `/auth/microsoft/start${params.toString() ? `?${params.toString()}` : ""}`;
          return;
        }

        if (googleError) {
          clearOauthAttempt();
          status.textContent = friendlyOauthError("google", googleError);
          return;
        }

        if (microsoftError) {
          clearOauthAttempt();
          status.textContent = friendlyOauthError("microsoft", microsoftError);
        }
      }

      loginButton.addEventListener("click", login);
      passwordInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          login();
        }
      });
      googleOauthButton.addEventListener("click", (event) => {
        event.preventDefault();
        beginOauth("google");
      });
      microsoftOauthButton.addEventListener("click", (event) => {
        event.preventDefault();
        beginOauth("microsoft");
      });
      loadSession();
    </script>
  </body>
</html>
