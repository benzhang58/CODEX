<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log In</title>
    <style>
      :root {
        --bg: #f5f5f7;
        --panel: rgba(255, 255, 255, 0.92);
        --border: #d9d9de;
        --text: #111111;
        --muted: #6e6e73;
        --accent: #111111;
        --shadow: 0 14px 40px rgba(17, 17, 17, 0.06);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(0, 0, 0, 0.035), transparent 32%),
          linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
      }

      .card {
        width: min(100%, 620px);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 28px;
        padding: 32px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(14px);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 42px;
        font-weight: 650;
        letter-spacing: -0.05em;
      }

      p {
        margin: 0 0 22px;
        color: var(--muted);
        line-height: 1.55;
      }

      .field {
        display: grid;
        gap: 6px;
        margin-bottom: 16px;
      }

      label {
        font-size: 14px;
        color: var(--muted);
      }

      input,
      button,
      a {
        font: inherit;
      }

      input {
        width: 100%;
        padding: 13px 14px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.96);
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 12px;
        margin-top: 20px;
      }

      .create-account-row {
        margin-top: 14px;
        text-align: center;
      }

      .create-account-link {
        display: inline-block;
        font-size: 13px;
        color: var(--muted);
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      button,
      .secondary-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 12px 16px;
        border-radius: 14px;
        text-decoration: none;
        font-weight: 600;
      }

      button {
        border: 1px solid #111111;
        background: #111111;
        color: #ffffff;
        cursor: pointer;
      }

      .secondary-button {
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.96);
        color: var(--text);
      }

      .status {
        margin-top: 18px;
        color: var(--muted);
        min-height: 22px;
      }

      @media (max-width: 720px) {
        .actions {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Email Dashboard</h1>
      <p>Log in with Gmail or Outlook. If you have a different email address, create an account.</p>

      <div class="field">
        <label for="emailInput">Email</label>
        <input id="emailInput" type="email" placeholder="you@example.com" />
      </div>

      <div class="field">
        <label for="passwordInput">Password</label>
        <input id="passwordInput" type="password" placeholder="Password" />
      </div>

      <div class="actions">
        <button id="loginButton" type="button">Log In</button>
        <a class="secondary-button" href="/auth/google/start">Continue with Google</a>
        <a class="secondary-button" href="/auth/microsoft/start">Continue with Microsoft</a>
      </div>

      <div class="create-account-row">
        <a class="create-account-link" href="/signup">Create account</a>
      </div>

      <div id="status" class="status"></div>
    </main>

    <script>
      const emailInput = document.getElementById("emailInput");
      const passwordInput = document.getElementById("passwordInput");
      const loginButton = document.getElementById("loginButton");
      const status = document.getElementById("status");

      function looksLikeEmail(value) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(value || "").trim());
      }

      async function login() {
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        if (!email || !password) {
          status.textContent = "Enter your email and password first.";
          return;
        }
        if (!looksLikeEmail(email)) {
          status.textContent = "Incorrect email.";
          return;
        }

        loginButton.disabled = true;
        status.textContent = `Logging in as ${email}...`;
        try {
          const response = await fetch("/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });
          const data = await response.json();
          if (!response.ok) {
            status.textContent = data.detail || "Login failed.";
            return;
          }
          window.location.href = "/dashboard";
        } catch (error) {
          status.textContent = `Login failed: ${error.message}`;
        } finally {
          loginButton.disabled = false;
        }
      }

      async function loadSession() {
        const params = new URLSearchParams(window.location.search);
        const googleError = params.get("google_error");
        const microsoftError = params.get("microsoft_error");
        const response = await fetch("/auth/me");
        const data = await response.json();
        if (data.authenticated) {
          window.location.href = "/dashboard";
          return;
        }

        if (googleError) {
          status.textContent =
            googleError === "not_configured"
              ? "Google sign-in is not configured yet. Add GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET first."
              : `Google sign-in failed: ${googleError.replaceAll("_", " ")}`;
          return;
        }

        if (microsoftError) {
          status.textContent =
            microsoftError === "not_configured"
              ? "Microsoft sign-in is not configured yet. Add MICROSOFT_CLIENT_ID and MICROSOFT_CLIENT_SECRET first."
              : `Microsoft sign-in failed: ${microsoftError.replaceAll("_", " ")}`;
        }
      }

      loginButton.addEventListener("click", login);
      passwordInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          login();
        }
      });
      loadSession();
    </script>
  </body>
</html>
