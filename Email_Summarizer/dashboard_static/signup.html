<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Private Client Signup</title>
    <link rel="icon" type="image/png" href="/dashboard_static/discere-logo.png" />
    <link rel="apple-touch-icon" href="/dashboard_static/discere-logo.png" />
    <style>
      :root {
        --bg: #f5f5f7;
        --panel: rgba(255, 255, 255, 0.92);
        --border: #d9d9de;
        --text: #111111;
        --muted: #6e6e73;
        --accent: #111111;
        --shadow: 0 14px 40px rgba(17, 17, 17, 0.06);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(0, 0, 0, 0.035), transparent 32%),
          linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
      }

      .card {
        width: min(100%, 540px);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 28px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(14px);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 36px;
        font-weight: 650;
        letter-spacing: -0.04em;
      }

      p {
        margin: 0 0 18px;
        color: var(--muted);
        line-height: 1.5;
      }

      .field {
        display: grid;
        gap: 6px;
        margin-bottom: 14px;
      }

      select {
        width: 100%;
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.96);
      }

      label {
        font-size: 14px;
        color: var(--muted);
      }

      input,
      button,
      a {
        font: inherit;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.96);
      }

      .actions {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-top: 18px;
      }

      .consent-row {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        margin-top: 8px;
      }

      .consent-row input[type="checkbox"] {
        width: 18px;
        height: 18px;
        margin-top: 2px;
      }

      .consent-copy {
        margin: 0;
        font-size: 14px;
        color: var(--muted);
        line-height: 1.5;
      }

      .consent-copy a {
        color: var(--text);
        text-decoration: underline;
      }

      button {
        padding: 12px 16px;
        border-radius: 14px;
        border: 1px solid #111111;
        background: #111111;
        color: #ffffff;
        cursor: pointer;
        font-weight: 600;
      }

      .secondary-link {
        color: var(--text);
        text-decoration: none;
      }

      .secondary-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 16px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.96);
        color: var(--text);
        text-decoration: none;
        font-weight: 600;
      }

      .status {
        margin-top: 16px;
        color: var(--muted);
        min-height: 22px;
      }

      .modal-shell {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: rgba(17, 17, 17, 0.36);
        z-index: 20;
      }

      .modal-shell[hidden] {
        display: none;
      }

      .modal-card {
        width: min(100%, 520px);
        background: rgba(255, 255, 255, 0.98);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 28px;
        box-shadow: 0 24px 70px rgba(17, 17, 17, 0.18);
      }

      .modal-card h2 {
        margin: 0 0 10px;
        font-size: 30px;
        letter-spacing: -0.04em;
      }

      .modal-actions {
        display: flex;
        gap: 12px;
        justify-content: flex-end;
        margin-top: 18px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Private Client Signup</h1>
      <p>This page is only for approved private clients. Gmail and Outlook users should log in normally.</p>

      <div class="field">
        <label for="accessPasswordInput">Private Access Password</label>
        <input id="accessPasswordInput" type="password" placeholder="Private access password" autocomplete="off" />
      </div>

      <div class="field">
        <label for="emailInput">Email</label>
        <input id="emailInput" type="email" placeholder="you@example.com" />
      </div>

      <div class="field">
        <label for="passwordInput">Password</label>
        <input id="passwordInput" type="password" placeholder="At least 8 characters" />
      </div>

      <div class="field">
        <label for="birthdayInput">Birthday</label>
        <input id="birthdayInput" type="date" />
      </div>

      <div class="field">
        <label for="genderInput">Gender</label>
        <select id="genderInput">
          <option value="">Select gender</option>
          <option value="Female">Female</option>
          <option value="Male">Male</option>
          <option value="Non-binary">Non-binary</option>
          <option value="Prefer not to say">Prefer not to say</option>
        </select>
      </div>

      <label class="consent-row" for="acceptTermsInput">
        <input id="acceptTermsInput" type="checkbox" />
        <p class="consent-copy">
          I agree to the <a href="/terms" target="_blank" rel="noopener noreferrer">Terms of Service</a> and
          <a href="/privacy" target="_blank" rel="noopener noreferrer">Privacy Policy</a>.
        </p>
      </label>

      <div class="actions">
        <button id="createButton" type="button">Create Private Account</button>
        <a class="secondary-button" href="/manual-login">Back to Private Login</a>
      </div>

      <div id="status" class="status"></div>
    </main>

    <div id="mailboxPasswordModal" class="modal-shell" hidden>
      <div class="modal-card">
        <h2>Connect 263 Mail</h2>
        <p>Enter your 263 mail password or client authorization code. Discere encrypts it and does not show it back to anyone.</p>
        <div class="field">
          <label for="mailboxPasswordInput">263 Mail Password or Authorization Code</label>
          <input id="mailboxPasswordInput" type="password" placeholder="Enter 263 mail password or authorization code" autocomplete="off" />
        </div>
        <div id="mailboxPasswordStatus" class="status"></div>
        <div class="modal-actions">
          <button id="skipMailboxPasswordButton" type="button" class="secondary-button">Enter Later</button>
          <button id="saveMailboxPasswordButton" type="button">Save and Continue</button>
        </div>
      </div>
    </div>

    <script>
      const emailInput = document.getElementById("emailInput");
      const passwordInput = document.getElementById("passwordInput");
      const accessPasswordInput = document.getElementById("accessPasswordInput");
      const birthdayInput = document.getElementById("birthdayInput");
      const genderInput = document.getElementById("genderInput");
      const acceptTermsInput = document.getElementById("acceptTermsInput");
      const createButton = document.getElementById("createButton");
      const status = document.getElementById("status");
      const mailboxPasswordModal = document.getElementById("mailboxPasswordModal");
      const mailboxPasswordInput = document.getElementById("mailboxPasswordInput");
      const mailboxPasswordStatus = document.getElementById("mailboxPasswordStatus");
      const saveMailboxPasswordButton = document.getElementById("saveMailboxPasswordButton");
      const skipMailboxPasswordButton = document.getElementById("skipMailboxPasswordButton");

      function looksLikeEmail(value) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(value || "").trim());
      }

      function openMailboxPasswordModal() {
        mailboxPasswordInput.value = "";
        mailboxPasswordStatus.textContent = "";
        mailboxPasswordModal.hidden = false;
        mailboxPasswordInput.focus();
      }

      function goToDashboard() {
        window.location.href = "/dashboard";
      }

      async function saveMailboxPassword() {
        const mailboxPassword = mailboxPasswordInput.value;
        if (!mailboxPassword.trim()) {
          mailboxPasswordStatus.textContent = "Enter your 263 mail password or authorization code first.";
          return;
        }

        saveMailboxPasswordButton.disabled = true;
        skipMailboxPasswordButton.disabled = true;
        mailboxPasswordStatus.textContent = "Saving encrypted mailbox connection...";
        try {
          const response = await fetch("/mailbox/vip-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ mailbox_password: mailboxPassword }),
          });
          mailboxPasswordInput.value = "";
          const data = await response.json();
          if (!response.ok) {
            mailboxPasswordStatus.textContent = data.detail || "Could not save mailbox connection.";
            return;
          }
          goToDashboard();
        } catch (error) {
          mailboxPasswordStatus.textContent = "Could not save mailbox connection. Please try again.";
        } finally {
          saveMailboxPasswordButton.disabled = false;
          skipMailboxPasswordButton.disabled = false;
        }
      }

      async function signup() {
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        const manualAccessPassword = accessPasswordInput.value;
        const birthday = birthdayInput.value.trim();
        const gender = genderInput.value.trim();
        const accepted = acceptTermsInput.checked;

        if (!manualAccessPassword || !email || !password || !birthday || !gender) {
          status.textContent = "Complete all fields first.";
          return;
        }
        if (!accepted) {
          status.textContent = "Accept the Terms of Service and Privacy Policy first.";
          return;
        }
        if (!looksLikeEmail(email)) {
          status.textContent = "Incorrect email.";
          return;
        }

        createButton.disabled = true;
        status.textContent = "Creating account...";

        try {
          const response = await fetch("/auth/signup", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              email,
              password,
              manual_access_password: manualAccessPassword,
              birthday,
              gender,
              accept_terms: true,
              accept_privacy: true,
            }),
          });
          const data = await response.json();

          if (!response.ok) {
            status.textContent = data.detail || "Failed to create private account.";
            return;
          }

          if (data.profile?.manual_mailbox_allowed && !data.profile?.settings?.mailbox_connected) {
            openMailboxPasswordModal();
            return;
          }

          goToDashboard();
        } catch (error) {
          status.textContent = `Failed to create private account: ${error.message}`;
        } finally {
          createButton.disabled = false;
        }
      }

      createButton.addEventListener("click", signup);
      saveMailboxPasswordButton.addEventListener("click", saveMailboxPassword);
      skipMailboxPasswordButton.addEventListener("click", goToDashboard);
      mailboxPasswordInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          saveMailboxPassword();
        }
      });
      passwordInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          signup();
        }
      });
    </script>
  </body>
</html>
